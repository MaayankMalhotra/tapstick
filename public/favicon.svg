<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="pop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#18181B" flood-opacity="1"/>
    </filter>
  </defs>
  <!-- Die-cut Vinyl Badge Background -->
  <rect x="6" y="6" width="50" height="50" rx="14" fill="#FFE600" stroke="#18181B" stroke-width="4" filter="url(#pop-shadow)"/>
  
  <!-- Tactile Peel Corner (Top-Right) -->
  <path d="M42 6 L56 20 L42 20 Z" fill="#FF334B" stroke="#18181B" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Bold Tabstick "T" Letterform with Playful Pop Ink -->
  <path d="M18 20 H40" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>
  <path d="M29 20 V46" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Pop Star Sparkle (Bottom-Right) -->
  <circle cx="44" cy="42" r="4.5" fill="#FF334B" stroke="#18181B" stroke-width="2"/>
  <circle cx="43" cy="40.5" r="1.5" fill="#FFFFFF"/>
</svg>
